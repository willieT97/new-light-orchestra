      <stop offset="0" stop-color="#ffe7b0"/>
      <stop offset="0.6" stop-color="#c9973a"/>
      <stop offset="1" stop-color="#8a6220"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0.55" stop-color="#e2b960" stop-opacity="0.5"/>
